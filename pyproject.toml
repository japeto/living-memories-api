[project]
name = "living-memories-api"
version = "0.1.0"
description = "FastAPI backend for the Mi Recuerdo Vivo mobile application"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
